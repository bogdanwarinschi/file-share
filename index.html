<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Share</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { text-align: center; margin: 32px 0 8px; font-size: 1.8rem; color: #fff; }
  .subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 0.9rem; }

  /* Login */
  #login-screen { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 80px; }
  #login-screen input { padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 1rem; width: 260px; text-align: center; }
  #login-screen button { padding: 12px 32px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
  #login-screen button:hover { background: #1d4ed8; }

  /* Main */
  #main-screen { display: none; }

  /* Upload area */
  .upload-area { border: 2px dashed #333; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 24px; }
  .upload-area:hover, .upload-area.dragover { border-color: #2563eb; background: #1a1a2e; }
  .upload-area p { color: #888; }
  .upload-area .big { font-size: 1.1rem; color: #ccc; margin-bottom: 4px; }
  #file-input { display: none; }

  /* Progress */
  .progress-bar { height: 4px; background: #1a1a1a; border-radius: 2px; margin-bottom: 24px; display: none; }
  .progress-bar .fill { height: 100%; background: #2563eb; border-radius: 2px; transition: width 0.2s; width: 0%; }

  .status { text-align: center; color: #2563eb; margin-bottom: 16px; min-height: 20px; }
  .empty { text-align: center; color: #555; padding: 40px; }

  /* Gallery grid */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  @media (max-width: 500px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; } }

  .gallery-item { position: relative; border-radius: 10px; overflow: hidden; background: #1a1a1a; cursor: pointer; aspect-ratio: 1; }
  .gallery-item:hover { outline: 2px solid #2563eb; }
  .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .play-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .gallery-item .play-badge::after { content: ""; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
  .gallery-item .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); display: flex; align-items: center; justify-content: space-between; opacity: 0; transition: opacity 0.2s; }
  .gallery-item:hover .overlay { opacity: 1; }
  .gallery-item .overlay .fname { font-size: 0.7rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 6px; }
  .gallery-item .overlay .fsize { font-size: 0.65rem; color: #888; white-space: nowrap; }

  .gallery-item .actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
  .gallery-item:hover .actions { opacity: 1; }
  .gallery-item .actions button { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .btn-del { background: rgba(0,0,0,0.6); color: #f87171; }
  .btn-del:hover { background: #dc2626; color: #fff; }
  .btn-dl { background: rgba(0,0,0,0.6); color: #60a5fa; }
  .btn-dl:hover { background: #2563eb; color: #fff; }

  /* Non-media files */
  .file-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .file-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #1a1a1a; border-radius: 8px; }
  .file-item .info { flex: 1; min-width: 0; }
  .file-item .name { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
  .file-item .meta { color: #666; font-size: 0.8rem; margin-top: 2px; }
  .file-item button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; }
  .btn-download { background: #2563eb; color: #fff; }
  .btn-download:hover { background: #1d4ed8; }
  .btn-delete { background: #333; color: #ccc; }
  .btn-delete:hover { background: #dc2626; color: #fff; }

  /* Preview modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal-content { max-width: 92vw; max-height: 80vh; }
  .modal-content img, .modal-content video { max-width: 92vw; max-height: 80vh; border-radius: 8px; }
  .modal-close { position: fixed; top: 16px; right: 24px; font-size: 2rem; color: #fff; cursor: pointer; z-index: 101; }
  .modal-actions { display: flex; gap: 12px; margin-top: 16px; }
  .modal-actions button { padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="container">
  <h1>File Share</h1>
  <p class="subtitle">Upload and download photos & videos</p>

  <div id="login-screen">
    <input type="password" id="pw-input" placeholder="Enter password" autofocus>
    <button onclick="login()">Enter</button>
  </div>

  <div id="main-screen">
    <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <p class="big">Drop files here or click to upload</p>
      <p>Photos and videos up to 500 MB each</p>
    </div>
    <input type="file" id="file-input" multiple>

    <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
    <div class="status" id="status"></div>
    <div class="gallery" id="gallery"></div>
    <div class="file-list" id="file-list"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <div class="modal-content" id="modal-content" onclick="event.stopPropagation()"></div>
  <div class="modal-actions" id="modal-actions" onclick="event.stopPropagation()"></div>
</div>

<script>
let pw = "";
let fileCache = []; // stores {name, size, uploaded, url}
const IMAGE_EXTS = ["jpg","jpeg","png","gif","webp","bmp","svg","heic"];
const VIDEO_EXTS = ["mp4","mov","webm","avi","mkv","m4v"];

function extOf(name) { return name.split(".").pop().toLowerCase(); }
function isImage(name) { return IMAGE_EXTS.includes(extOf(name)); }
function isVideo(name) { return VIDEO_EXTS.includes(extOf(name)); }
function getFileUrl(name) {
  const f = fileCache.find((x) => x.name === name);
  return f && f.url ? f.url : null;
}

document.getElementById("pw-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});

function login() {
  pw = document.getElementById("pw-input").value;
  fetch("/api/files?pw=" + encodeURIComponent(pw))
    .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
    .then((files) => {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "block";
      fileCache = files;
      renderFiles(files);
    })
    .catch(() => alert("Wrong password"));
}

// Drag and drop
const dropZone = document.getElementById("drop-zone");
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  uploadFiles(e.dataTransfer.files);
});

document.getElementById("file-input").addEventListener("change", (e) => {
  uploadFiles(e.target.files);
  e.target.value = "";
});

async function uploadFiles(fileList) {
  if (!fileList.length) return;
  const bar = document.getElementById("progress-bar");
  const fill = document.getElementById("progress-fill");
  const status = document.getElementById("status");
  bar.style.display = "block";
  fill.style.width = "0%";

  const total = fileList.length;
  let done = 0;

  for (const file of fileList) {
    status.textContent = `Uploading ${done + 1} of ${total}...`;

    // Step 1: get signed upload URL from our server
    const res = await fetch("/api/upload-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: file.name, pw }),
    });
    if (!res.ok) { status.textContent = "Upload failed"; bar.style.display = "none"; return; }
    const { signedUrl, token, path: storagePath } = await res.json();

    // Step 2: upload directly to Supabase
    const uploadRes = await fetch(signedUrl, {
      method: "PUT",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
    if (!uploadRes.ok) { status.textContent = "Upload failed"; bar.style.display = "none"; return; }

    done++;
    fill.style.width = Math.round((done / total) * 100) + "%";
  }

  bar.style.display = "none";
  status.textContent = "Upload complete!";
  setTimeout(() => status.textContent = "", 2000);
  loadFiles();
}

function loadFiles() {
  fetch("/api/files?pw=" + encodeURIComponent(pw))
    .then((r) => r.json())
    .then((files) => { fileCache = files; renderFiles(files); });
}

function renderFiles(files) {
  const gallery = document.getElementById("gallery");
  const list = document.getElementById("file-list");

  const media = files.filter((f) => isImage(f.name) || isVideo(f.name));
  const other = files.filter((f) => !isImage(f.name) && !isVideo(f.name));

  if (!media.length && !other.length) {
    gallery.innerHTML = "";
    list.innerHTML = '<div class="empty">No files yet</div>';
    return;
  }

  gallery.innerHTML = media.map((f) => {
    const url = f.url || "";
    const vid = isVideo(f.name);
    const thumb = vid
      ? `<video src="${url}" muted preload="metadata"></video><div class="play-badge"></div>`
      : `<img src="${url}" loading="lazy" alt="">`;
    return `<div class="gallery-item" onclick="openPreview('${esc(f.name)}')">
      ${thumb}
      <div class="actions">
        <button class="btn-dl" onclick="event.stopPropagation(); download('${esc(f.name)}')" title="Download">&#8595;</button>
        <button class="btn-del" onclick="event.stopPropagation(); del('${esc(f.name)}')" title="Delete">&#10005;</button>
      </div>
      <div class="overlay">
        <span class="fname">${f.name}</span>
        <span class="fsize">${formatSize(f.size)}</span>
      </div>
    </div>`;
  }).join("");

  if (other.length) {
    list.innerHTML = other.map((f) => {
      const size = formatSize(f.size);
      const date = new Date(f.uploaded).toLocaleDateString();
      return `<div class="file-item">
        <div class="info"><div class="name" title="${f.name}">${f.name}</div><div class="meta">${size} &middot; ${date}</div></div>
        <button class="btn-download" onclick="download('${esc(f.name)}')">Download</button>
        <button class="btn-delete" onclick="del('${esc(f.name)}')">Delete</button>
      </div>`;
    }).join("");
  } else {
    list.innerHTML = "";
  }
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB";
}

function download(name) {
  const url = getFileUrl(name);
  if (!url) return;
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function del(name) {
  if (!confirm("Delete " + name + "?")) return;
  fetch("/api/files/" + encodeURIComponent(name) + "?pw=" + encodeURIComponent(pw), { method: "DELETE" })
    .then(() => { closeModal(); loadFiles(); });
}

function openPreview(name) {
  const url = getFileUrl(name);
  if (!url) return;
  const mc = document.getElementById("modal-content");
  const ma = document.getElementById("modal-actions");
  const vid = isVideo(name);
  mc.innerHTML = vid
    ? `<video src="${url}" controls autoplay playsinline style="max-width:92vw;max-height:80vh;border-radius:8px"></video>`
    : `<img src="${url}" style="max-width:92vw;max-height:80vh;border-radius:8px">`;
  ma.innerHTML = `
    <button class="btn-download" onclick="download('${esc(name)}')">Download</button>
    <button class="btn-delete" onclick="del('${esc(name)}')">Delete</button>`;
  document.getElementById("modal").classList.add("active");
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
  document.getElementById("modal-content").innerHTML = "";
  document.getElementById("modal-actions").innerHTML = "";
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
